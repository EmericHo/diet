<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">{{ title() }}</span>
</mat-toolbar>

<mat-drawer-container class="app-container">
  <mat-drawer #drawer mode="side" opened class="app-drawer">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Accueil</span>
      </a>
      
      <a mat-list-item routerLink="/recipes" routerLinkActive="active">
        <mat-icon matListItemIcon>restaurant_menu</mat-icon>
        <span matListItemTitle>Recettes</span>
      </a>
      
      <a mat-list-item routerLink="/shopping" routerLinkActive="active">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Liste de Courses</span>
      </a>
    </mat-nav-list>
  </mat-drawer>
  
  <mat-drawer-content class="app-content">
    <router-outlet />
  </mat-drawer-content>
</mat-drawer-container>
